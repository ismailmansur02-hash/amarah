<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — The Little Shop of Gratitude</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<section class="hero" style="min-height:100svh">
  <div class="grain" aria-hidden="true"></div>
  <div class="hero__inner">
    <span class="wreath" aria-hidden="true" style="width:150px;color:var(--cream);margin:0 auto 2.25rem"></span>
    <h1 style="font-family:var(--display);font-size:clamp(2.2rem,1.6rem+2.4vw,3.4rem);color:var(--cream)">
      Thank you
    </h1>
    <p class="hero__tagline" id="line">Your deposit is received. We will be in touch to confirm your session.</p>
    <p><a href="/" style="color:var(--cream);font-size:.78rem;letter-spacing:.26em;text-transform:uppercase">Back to the shop</a></p>
  </div>
</section>
<script>
  if (!new URLSearchParams(location.search).has("paid")) {
    document.getElementById("line").textContent =
      "Your message is with us. We will write back as soon as we can.";
  }
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>

<body>
<section class="hero">
  <div class="hero-content">

    <h1 class="section-title" style="margin-bottom:0.8rem">Thank <em>you</em></h1>
    <p class="hero-tagline" id="line">Your deposit is received. We will be in touch to confirm your session.</p>

  if (!new URLSearchParams(location.search).has("paid")) {
    document.getElementById("line").textContent =

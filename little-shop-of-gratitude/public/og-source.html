<!doctype html>
<!-- The source of /assets/img/og.png, the picture shown when the site is
     shared. Re-render this page at 1200x630 after changing it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Share card source</title>
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
  .og {
    width: 1200px; height: 630px;
    position: relative; overflow: hidden;
    background: var(--sage);
    display: flex; align-items: center; justify-content: center;
  }
  .og::before {
    content: ''; position: absolute; inset: 0;
    background-image: var(--grain); background-size: 180px; opacity: .4;
  }
  .og .hero-content { animation: none; opacity: 1; transform: none; }
  .og .circular-text { width: 340px; height: 340px; }
  .og .hero-logo-wrap { margin-bottom: 1.2rem; }
  .og .hero-tagline { font-size: 1.55rem; margin-bottom: 0; }
</style>
</head>
<body>
<div class="og">
  <div class="hero-content">
    <p class="hero-eyebrow">Welcome to</p>
    <div class="hero-logo-wrap">
      <svg class="circular-text" viewBox="0 0 400 400">
        <defs>
          <path id="topArc" d="M 35,200 A 165,165 0 0,1 365,200" fill="none"/>
          <path id="bottomArc" d="M 55,268 A 152,152 0 0,0 345,268" fill="none"/>
        </defs>
        <image href="/assets/img/wreath.png" x="112" y="78" width="176" height="222" preserveAspectRatio="xMidYMid meet"/>
        <text class="arc-top" text-anchor="middle"><textPath href="#topArc" startOffset="50%">THE LITTLE SHOP OF</textPath></text>
        <text class="arc-bottom" text-anchor="middle"><textPath href="#bottomArc" startOffset="50%">GRATITUDE&trade;</textPath></text>
      </svg>
    </div>
    <p class="hero-tagline">Mindful gifts &amp; heartfelt tokens</p>
  </div>
</div>
</body>
</html>

# Netlify build configuration for this repository.
#
# The property portal lives in the property-portal/ subfolder, so `base`
# points Netlify at it. Netlify reads this file from the repository root
# before anything else, which means no "base directory" needs to be set by
# hand in the Netlify UI — selecting this branch is enough.
#
# Everything below is relative to `base`.

[build]
  base = "property-portal"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Turns the Next.js App Router into Netlify functions and serves static
# assets from the CDN.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# The service worker must never be cached, or clients keep running an old one.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Netlify build config for the Prep a Constable web preview.
#
# The `prep-a-constable-preview` site is linked to this repository, so every push
# to the production branch rebuilds and publishes the preview automatically.
#
# IMPORTANT — the Netlify site must point at a branch that actually contains
# prep-a-constable/. This repository's DEFAULT branch belongs to a separate,
# unrelated project and has no prep-a-constable/ directory, so a site linked to
# the default branch fails immediately with "base directory does not exist".
# Production branch is currently claude/full-app-audit-rraf3e.
#
# Verified: `npm install && npm run build` succeeds from a clean checkout of the
# committed tree and emits dist/bundle.js + dist/index.html.

[build]
  base = "prep-a-constable/preview"
  command = "npm install && npm run build"
  publish = "dist"            # relative to `base` → prep-a-constable/preview/dist

[build.environment]
  NODE_VERSION = "20"

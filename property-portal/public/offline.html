<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline — E, Management</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 1.5rem;
      }
      .card {
        max-width: 24rem;
        width: 100%;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 0.75rem;
        padding: 2rem;
        text-align: center;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { color: #64748b; font-size: 0.9rem; line-height: 1.5; margin: 0 0 1.5rem; }
      button {
        background: #0f172a;
        color: #fff;
        border: 0;
        border-radius: 0.375rem;
        padding: 0.6rem 1.25rem;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
      }
      .brand { font-weight: 600; letter-spacing: -0.01em; margin-bottom: 1.25rem; }
      .brand span { color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">E, <span>Management</span></div>
      <h1>You're offline</h1>
      <p>
        Your property records live on the server, so this app needs a connection to show them.
        Reconnect and try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>

# Fly.io deployment. See DEPLOY.md for the full walkthrough.
#
#   fly launch --no-deploy --copy-config
#   fly volumes create portal_data --size 3
#   fly secrets set SESSION_SECRET="$(openssl rand -base64 32)" \
#                   INITIAL_MANAGER_PASSWORD="a-strong-password"
#   fly deploy

app = "e-management-portal"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

# The database and uploaded documents live on this volume. Without it every
# deploy would start from an empty database.
[[mounts]]
  source = "portal_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # A single machine — SQLite is one file on one volume and must not be
  # written by two machines at once.
  min_machines_running = 1

  [http_service.http_options.response.headers]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
